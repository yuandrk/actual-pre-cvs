name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        # Note: Your Docker file is named "dockerfile" (lowercase). 
        # If you rename it to "Dockerfile", you can remove the -f option.
        run: docker build -f dockerfile -t csv-processor .

      - name: Run container test
        # This simple test runs a command inside the container (checks the Flask version)
        run: docker run --rm csv-processor flask --version
